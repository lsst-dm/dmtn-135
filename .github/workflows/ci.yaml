name: CI

"on": [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for metadata
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python install
        run: |
          python -m pip install --upgrade pip
          # lander 1.x needs pandoc >= 2.11; pypandoc_binary bundles one.
          python -m pip install "lander<2.0.0" pypandoc_binary

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sqrereadonly
          password: ${{ secrets.DOCKERHUB_SQREREADONLY_TOKEN }}

      - name: make tables from google
        env:
          CLIENT: ${{ secrets.SIZING_MODEL_ACCESS }}
          TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
        run: |
          echo $CLIENT >> client_secret.json
          ./decrypt_secret.sh
          docker run --rm -v `pwd`:/workspace -w /workspace lsstsqre/lsst-texmf:latest sh -c 'make gdepend tables'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: make tables from the sizing model (GitHub)
        run: |
          uv run --no-project --python 3.11 bin/sizing_tables.py
          git diff --quiet -- update2026/tables || echo "::warning::update2026/tables differ from the pinned sizing model; run 'make sizing-tables' and commit."

      - name: TeX build
        run: |
          docker run --rm -v `pwd`:/workspace -w /workspace lsstsqre/lsst-texmf:latest sh -c 'make'

      - name: Landing page upload
        if: ${{ github.event_name == 'push' }}
        env:
          LTD_PASSWORD: ${{ secrets.LTD_PASSWORD }}
          LTD_USERNAME: ${{ secrets.LTD_USERNAME }}
        run: |
          lander --upload --pdf DMTN-135.pdf --lsstdoc DMTN-135.tex --ltd-product dmtn-135
